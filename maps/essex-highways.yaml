# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
#
# New Jersey: when each section of the highways that run through Essex County
# opened, followed across the whole state. Shown on essex-highways.html, whose
# decade buttons filter these layers to the roads open by the end of each
# decade (see the <script> there).
#
# Road shapes: OpenStreetMap (highway=motorway), clipped to New Jersey.
# Opening dates: compiled from published highway histories (Wikipedia, NYCRoads);
# each section's source is in its `source` property in data/nj-highways.geojson.
# Each section has: road, section, opened (year; 9999 = unknown), decade,
# date_text, confidence (exact / approx / unknown), source.
type: map
id: nj-highways
config:
  mapStyle: "https://tiles.openfreemap.org/styles/positron"
  center: [-74.55, 40.12]
  zoom: 7.4

controls:
  navigation:
    enabled: true
    position: bottom-right

layers:
  # Essex County's 22 municipal borders and outline, for reference.
  - id: municipalities-line
    type: line
    source:
      type: geojson
      url: "data/essex-municipalities.geojson"
    minzoom: 9
    paint:
      line-color: "#9a9a9a"
      line-width: 0.8

  - id: county-outline
    type: line
    source:
      type: geojson
      url: "data/essex-county.geojson"
    paint:
      line-color: "#b2182b"
      line-width: 2

  # A dark edge under every highway so the colours stand out.
  - id: hwy-casing
    type: line
    source:
      type: geojson
      url: "data/nj-highways.geojson"
    layout:
      line-cap: round
      line-join: round
    paint:
      line-color: "#333333"
      line-opacity: 0.55
      line-width: ["interpolate", ["linear"], ["zoom"], 7, 3, 12, 7]

  # Sections with a confirmed opening date: solid lines.
  - id: hwy-exact
    type: line
    source:
      type: geojson
      url: "data/nj-highways.geojson"
    filter: ["==", ["get", "confidence"], "exact"]
    layout:
      line-cap: round
      line-join: round
    paint:
      # Colour by the decade the section opened. Keep in step with the legend
      # in essex-highways.html (and with hwy-approx below).
      line-color:
        - step
        - [get, opened]
        - "#0d0887"      # before 1930
        - 1930
        - "#5302a3"      # 1930s
        - 1940
        - "#8b0aa5"      # 1940s
        - 1950
        - "#b83289"      # 1950s
        - 1960
        - "#db5c68"      # 1960s
        - 1970
        - "#f48849"      # 1970s
        - 1980
        - "#febc2a"      # 1980s
        - 1990
        - "#d4e157"      # 1990s and later
        - 9999
        - "#9e9e9e"      # opening date not found
      line-width: ["interpolate", ["linear"], ["zoom"], 7, 1.6, 12, 4]
    interactive:
      hover:
        cursor: pointer
        popup:
          - strong:
              - property: road
          - p:
              - property: section
          - p:
              - str: "Opened: "
              - property: date_text

  # Sections with an approximate date (a range, or "by" a year): dashed.
  - id: hwy-approx
    type: line
    source:
      type: geojson
      url: "data/nj-highways.geojson"
    filter: ["!=", ["get", "confidence"], "exact"]
    layout:
      line-join: round
    paint:
      # Same colours as hwy-exact above.
      line-color:
        - step
        - [get, opened]
        - "#0d0887"
        - 1930
        - "#5302a3"
        - 1940
        - "#8b0aa5"
        - 1950
        - "#b83289"
        - 1960
        - "#db5c68"
        - 1970
        - "#f48849"
        - 1980
        - "#febc2a"
        - 1990
        - "#d4e157"
        - 9999
        - "#9e9e9e"
      line-width: ["interpolate", ["linear"], ["zoom"], 7, 1.6, 12, 4]
      line-dasharray: [1.5, 1]
    interactive:
      hover:
        cursor: pointer
        popup:
          - strong:
              - property: road
          - p:
              - property: section
          - p:
              - str: "Opened: "
              - property: date_text
