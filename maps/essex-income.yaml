        - "#d8b365"      # 0.5-0.75x
        - 0.75
        - "#f6e8c3"      # 0.75-0.9x
        - 0.9
        - "#f5f5f5"      # 0.9-1.1x   (about the US median)
        - 1.1
        - "#c7eae5"      # 1.1-1.5x
        - 1.5
        - "#5ab4ac"      # 1.5-2x
        - 2
        - "#01665e"      # 2x or more
      fill-opacity: 0.85
      fill-outline-color: "rgba(120,120,120,0.35)"
    interactive:
      hover:
        cursor: pointer
        popup:
          - strong:
              - str: "Tract "
              - property: tract
          - p:
              - str: "Median income: $"
              - property: median_label
                else: "not reported"
              - str: " "
              - property: note
                else: ""
          - p:
              - property: pct_of_national
              - str: "% of the US median ($"
              - property: national_label
