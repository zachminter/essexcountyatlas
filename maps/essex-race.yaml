# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
#
# Essex County, NJ: percent of each census tract's population that was white,
# one layer per census year. Only one layer is visible at a time; the decade
# buttons on essex-race.html switch between them (see the <script> there).
#
# Data: IPUMS NHGIS (tract counts and 1940-2000 tract boundaries) and US Census
# TIGERweb (2010 and 2020 tract boundaries). Built into data/essex-tracts-YEAR.geojson.
# Each tract has: tract, year, total, white, nonwhite, pct_white
# (pct_white is -1 where there is no data).
# Tract shapes were trimmed/snapped to the municipal borders in
# data/essex-municipalities.geojson so they line up; population counts are unchanged.
type: map
id: essex-race
config:
  mapStyle: "https://tiles.openfreemap.org/styles/positron"
  center: [-74.245, 40.792]
  zoom: 10.6

controls:
  navigation:
    enabled: true
    position: bottom-right

layers:
  - id: tracts-1940
    type: fill
    source:
      type: geojson
      url: "data/essex-tracts-1940.geojson"
    layout:
      visibility: visible
    paint:
      # Graduated colours by percent white (darker = whiter).
      # Grey = no data (-1). Change the colours or class breaks here.
      fill-color:
        - step
        - [get, pct_white]
        - "#bdbdbd"      # below 0: no data
        - 0
        - "#f1eef6"      # 0-20 %
        - 20
        - "#bdc9e1"      # 20-40 %
        - 40
        - "#74a9cf"      # 40-60 %
        - 60
        - "#2b8cbe"      # 60-80 %
        - 80
        - "#045a8d"      # 80-100 %
      fill-opacity: 0.8
      fill-outline-color: "rgba(255,255,255,0.6)"
    interactive:
      hover:
        cursor: pointer
        popup:
          - strong:
              - str: "Tract "
              - property: tract
          - p:
              - property: pct_white
              - str: "% white"
          - p:
              - property: white
              - str: " white of "
              - property: total
              - str: " people"

